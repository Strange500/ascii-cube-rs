<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rust WASM Cube</title>
    <style>
      body {
        background: #111;
        color: #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      /* This tag acts as our terminal screen */
      #terminal {
        font-family: monospace;
        white-space: pre; /* Keeps the ASCII shape correct */
        line-height: 10px; /* Compress lines to look square */
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <pre id="terminal"></pre>

    <script type="module">
      // Import the WASM init function and Engine class
      import init, { Engine, get_bitcoin_price } from './pkg/cube.js';

      async function run() {
        await init();
        const engine = Engine.new(180, 90);
        const preTag = document.getElementById("terminal");

        const price = await get_bitcoin_price();
        let speed = (() => {
            let target_price = 1_000_000.0;
            let min_price = 0.0;
            let min_speed = 0.5;
            let max_speed = 50.0;
            
            let factor = (price - min_price) / (target_price - min_price);
            factor = Math.max(0.0, Math.min(1.0, factor));
            return min_speed + (factor * factor * (max_speed - min_speed));
        })();

        console.log("Bitcoin price: $" + price);


        // CONFIGURATION
        const TARGET_FPS = 60;
        const STEP_TIME = 1000 / TARGET_FPS; // ~16.6ms per step

        let lastTime = performance.now();
        let accumulator = 0;

        const renderLoop = (currentTime) => {
            // 1. Calculate how much time passed since last frame (Delta Time)
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // 2. Add that time to our "accumulator" bucket
            accumulator += deltaTime;

            // 3. "Eat" the time in the accumulator by running fixed math steps
            // This ensures engine.rotate() always runs exactly 60 times per second
            // regardless of screen refresh rate.
            while (accumulator >= STEP_TIME) {
                engine.rotate(speed);
                accumulator -= STEP_TIME;
            }

            // 4. Render the visual state
            preTag.innerText = engine.render_frame();

            requestAnimationFrame(renderLoop);
        };

        requestAnimationFrame(renderLoop);
      }

      run();
    </script>
  </body>
</html>
