[package]
name = "cube"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"] 

[[bin]]
name = "cube-cli"
path = "src/main.rs"

[dependencies]
glam = "0.30.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ["Window", "Response", "Headers", "RequestInit", "RequestMode", "Request", "console"] }

# --- NATIVE Dependencies ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.1", features = ["json"] }
terminal_size = "0.4.3"

